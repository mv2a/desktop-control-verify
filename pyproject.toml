[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mozaik-automation"
version = "0.1.0"
description = "AI-powered companion tool for Mozaik cabinet design software"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["cabinet", "design", "automation", "vision", "llm", "dxf", "mozaik"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Vision & ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "pillow>=10.0.0",
    "pdf2image>=1.16.0",
    "opencv-python>=4.8.0",

    # LLM
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "llama-cpp-python>=0.2.0",

    # DXF Generation
    "ezdxf>=1.1.0",

    # UI Automation (Windows)
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyautogui>=0.9.54",

    # Data & Validation
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",

    # API
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.25.0",

    # Database
    "sqlalchemy>=2.0.0",

    # Utilities
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
training = [
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "peft>=0.6.0",
    "bitsandbytes>=0.41.0",
    "wandb>=0.15.0",
]

[project.scripts]
mozaik-ai = "mozaik_automation.cli:main"

[project.urls]
Homepage = "https://github.com/yourorg/mozaik-automation"
Documentation = "https://github.com/yourorg/mozaik-automation#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
env = [
    "MOZAIK_MOCK_VISION=1",
]
