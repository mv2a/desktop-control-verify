[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-control-verify"
version = "0.1.0"
description = "Cached-element control of Windows desktop applications, drawing-to-specification extraction, and code-enforced verification of the result."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tiago Miranda de Leão"}]
keywords = ["ui-automation", "win32", "ui-automation-tree", "legacy-software", "vision-language-models", "verification", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # Not published to PyPI. PyPI refuses any upload carrying a "Private ::" classifier;
    # remove this line only if a PyPI release is decided.
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# Vision backends for drawing extraction.
vision = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pdf2image>=1.16.0",
]
# The control layer and discovery scripts run on Windows only.
windows = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.0.0",
    "rich>=13.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
